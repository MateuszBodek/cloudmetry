[project]
name = "processing_worker"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"

authors = [
    { name = "Mateusz Bodek", email = ""}
]

dependencies = [
    "common",
    "dbt-duckdb>=1.9,<2",
    "deltalake>=1.0,<2",
    "duckdb>=1.2,<2",
    "pandas>=2.2",
    "pyarrow>=19",
    "requests>=2.32",
    "urllib3>=2.2",
]

[tool.uv.sources]
common = { workspace = true }

[tool.uv]
package = true


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
