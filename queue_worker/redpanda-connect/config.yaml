http:
  enabled: true
  address: 0.0.0.0:4195

input:
  mqtt:
    urls:
      - tcp://mqtt:1883
    client_id: cloudmetry-redpanda-connect-dev-2
    topics:
      - cloudmetry/vehicle/+/+
    qos: 1
    clean_session: false

output:
  kafka_franz:
    seed_brokers:
      - redpanda:9092
    client_id: cloudmetry-redpanda-connect
    topic: vehicle-telemetry
    key: '${! json("vehicle_id") }'
    partitioner: murmur2_hash
